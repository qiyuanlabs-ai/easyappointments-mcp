name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate && php artisan passport:keys
      - run: vendor/bin/pint --test
      - run: php artisan test

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ea-mcp-server:ci .
      - name: Validate server.json
        run: |
          pip install --quiet jsonschema
          curl -sSf "$(jq -r '."$schema"' server.json)" -o /tmp/schema.json
          python -c "import json, jsonschema; jsonschema.validate(json.load(open('server.json')), json.load(open('/tmp/schema.json')))"
